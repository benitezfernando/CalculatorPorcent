<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Calculadora de Porcentajes</title>
  <meta name="theme-color" content="#131316">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg style="display:none" aria-hidden="true">
    <symbol id="icon-percent" viewBox="0 0 20 20">
      <circle cx="6" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="14" cy="14" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="5" y1="15" x2="15" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-total" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7" fill="currentColor"/>
    </symbol>
    <symbol id="icon-ratio" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 10 L10 3 A7 7 0 0 1 16.06 13.5 Z" fill="currentColor"/>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 6.5 V10 L12.8 11.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 20 20">
      <path d="M4.5 6h11M8 6V4.6c0-.6.4-1 1-1h2c.6 0 1 .4 1 1V6m-6.5 0 .6 9.4c0 .6.5 1 1 1h5.8c.5 0 1-.4 1-1L14.5 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </svg>

  <div class="app">
    <header class="app-header">
      <h1>Calculadora</h1>
      <p class="app-subtitle">Calculá porcentajes al toque, sin conexión.</p>
    </header>

    <nav class="tabs" role="tablist" aria-label="Modo de cálculo">
      <button class="tab active" data-mode="cantidad" role="tab" aria-selected="true">
        <svg class="tab-icon" aria-hidden="true"><use href="#icon-percent"></use></svg>
        <span>Cantidad</span>
      </button>
      <button class="tab" data-mode="total" role="tab" aria-selected="false">
        <svg class="tab-icon" aria-hidden="true"><use href="#icon-total"></use></svg>
        <span>Total</span>
      </button>
      <button class="tab" data-mode="porcentaje" role="tab" aria-selected="false">
        <svg class="tab-icon" aria-hidden="true"><use href="#icon-ratio"></use></svg>
        <span>Porcentaje</span>
      </button>
    </nav>

    <main class="panel">
      <section class="mode-panel" data-mode-panel="cantidad">
        <label class="field-label" for="cantidad-porcentaje">Porcentaje</label>
        <input id="cantidad-porcentaje" type="text" inputmode="decimal" class="input" data-field="porcentaje" placeholder="0">

        <div class="field-divider" aria-hidden="true">
          <svg class="divider-icon"><use href="#icon-percent"></use></svg>
        </div>

        <label class="field-label" for="cantidad-total">Total</label>
        <input id="cantidad-total" type="text" inputmode="decimal" class="input" data-field="total" placeholder="0">

        <div class="summary-card">
          <div class="summary-label">Resultado</div>
          <div class="summary-value" data-result>—</div>
          <p class="example">El 70% de 10 es 7.</p>
        </div>
      </section>

      <section class="mode-panel" data-mode-panel="total" hidden>
        <label class="field-label" for="total-cantidad">Cantidad</label>
        <input id="total-cantidad" type="text" inputmode="decimal" class="input" data-field="cantidad" placeholder="0">

        <div class="field-divider" aria-hidden="true">
          <svg class="divider-icon"><use href="#icon-percent"></use></svg>
        </div>

        <label class="field-label" for="total-porcentaje">Porcentaje</label>
        <input id="total-porcentaje" type="text" inputmode="decimal" class="input" data-field="porcentaje" placeholder="0">

        <div class="summary-card">
          <div class="summary-label">Resultado</div>
          <div class="summary-value" data-result>—</div>
          <p class="example">Si 4 es el 40% de una cantidad total, esa cantidad total es 10.</p>
        </div>
      </section>

      <section class="mode-panel" data-mode-panel="porcentaje" hidden>
        <label class="field-label" for="porcentaje-cantidad">Cantidad</label>
        <input id="porcentaje-cantidad" type="text" inputmode="decimal" class="input" data-field="cantidad" placeholder="0">

        <div class="field-divider" aria-hidden="true">
          <svg class="divider-icon"><use href="#icon-ratio"></use></svg>
        </div>

        <label class="field-label" for="porcentaje-total">Total</label>
        <input id="porcentaje-total" type="text" inputmode="decimal" class="input" data-field="total" placeholder="0">

        <div class="summary-card">
          <div class="summary-label">Resultado</div>
          <div class="summary-value" data-result>—</div>
          <p class="example">3 es el 30% de 10.</p>
        </div>
      </section>
    </main>

    <section class="history">
      <button class="history-toggle" type="button" data-history-toggle aria-expanded="false">
        <svg class="history-toggle-icon" aria-hidden="true"><use href="#icon-clock"></use></svg>
        <span>Historial</span>
      </button>
      <div class="history-body" data-history-body hidden>
        <ul class="history-list" data-history-list></ul>
        <button class="history-clear" type="button" data-history-clear>
          <svg class="history-clear-icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
          <span>Limpiar historial</span>
        </button>
      </div>
    </section>

    <footer class="app-footer">© 2026 Fernando Benítez</footer>
  </div>

  <script src="calc.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
